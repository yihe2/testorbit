# Example GitHub Actions workflow for a project that uses TestOrbit.
# Copy this file to .github/workflows/testorbit.yml and adjust the install step
# if the package is not published yet.
name: testorbit

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TestOrbit
        run: |
          python -m pip install --upgrade pip
          pip install testorbit pytest

      - name: Run unit task
        run: testorbit run unit

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testorbit-reports
          path: reports/
