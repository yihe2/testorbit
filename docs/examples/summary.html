<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>TestOrbit Report</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1f2933;
        --muted: #52606d;
        --passed: #2f9e44;
        --failed: #e03131;
        --border: #d9e2ec;
      }
      body {
        margin: 2rem auto;
        max-width: 880px;
        font-family: Segoe UI, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      h1 { margin-bottom: 0.25rem; }
      .lede { color: var(--muted); margin-top: 0; }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin: 1.5rem 0;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
      }
      .card h2 {
        margin: 0;
        font-size: 0.9rem;
        color: var(--muted);
        font-weight: 600;
      }
      .card p {
        margin: 0.35rem 0 0;
        font-size: 2rem;
        font-weight: 700;
      }
      .card.passed p { color: var(--passed); }
      .card.failed p { color: var(--failed); }
      .chart {
        display: flex;
        height: 16px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 1.5rem;
      }
      .bar.passed { background: var(--passed); }
      .bar.failed { background: var(--failed); }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--card);
        border: 1px solid var(--border);
      }
      th, td {
        text-align: left;
        padding: 0.7rem 0.9rem;
        border-bottom: 1px solid var(--border);
      }
      th { color: var(--muted); font-size: 0.85rem; }
      tr.passed td:nth-child(2) { color: var(--passed); }
      tr.failed td:nth-child(2) { color: var(--failed); }
    </style>
  </head>
  <body>
    <h1>TestOrbit Summary</h1>
    <p class="lede">1 passed, 1 failed, 2 total</p>
    <section class="cards">
      <article class="card total">
        <h2>Total</h2>
        <p>2</p>
      </article>
      <article class="card passed">
        <h2>Passed</h2>
        <p>1</p>
      </article>
      <article class="card failed">
        <h2>Failed</h2>
        <p>1</p>
      </article>
    </section>
    <div class="chart" role="img" aria-label="1 passed, 1 failed">
      <div class="bar passed" style="width: 50.0%"></div>
      <div class="bar failed" style="width: 50.0%"></div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Task</th>
          <th>Status</th>
          <th>Duration</th>
        </tr>
      </thead>
      <tbody>
        <tr class="passed">
          <td>unit</td>
          <td>passed</td>
          <td>0.42s</td>
        </tr>
        <tr class="failed">
          <td>smoke</td>
          <td>failed</td>
          <td>0.8s</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
